
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>My Skills | JobPortalPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #0f172a;
        }

        .skills-card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 6px 25px rgba(0,0,0,.06);
            max-width: 800px;
            margin: 45px auto;
        }

        .form-control {
            border-radius: 10px;
            padding: 14px;
        }

        .btn {
            border-radius: 9px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/candidate/dashboard}">
            JobPortalPro
        </a>

        <a th:href="@{/candidate/dashboard}"
           class="btn btn-outline-light">
            <i class="bi bi-arrow-left"></i>
            Dashboard
        </a>

    </div>
</nav>

<div class="container">

    <div class="skills-card">

        <h3 class="fw-bold">
            <i class="bi bi-code-slash text-primary"></i>
            My Technical Skills
        </h3>

        <p class="text-muted">
            Add or update your technical skills to receive
            relevant job recommendations.
        </p>

        <hr>

        <div th:if="${success}"
             class="alert alert-success"
             th:text="${success}">
        </div>

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <form th:action="@{/candidate/skills}"
              method="post">

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Technical Skills
                </label>

                <textarea name="skills"
                          class="form-control"
                          rows="5"
                          maxlength="1000"
                          placeholder="Java, Spring Boot, MySQL, HTML, CSS, JavaScript"
                          th:text="${user.skills}"></textarea>

                <small class="text-muted">
                    Separate each skill with a comma.
                    Maximum 1000 characters.
                </small>

            </div>

            <div class="d-flex gap-3 flex-wrap">

                <button type="submit"
                        class="btn btn-primary">
                    <i class="bi bi-check-circle me-1"></i>
                    Save Skills
                </button>

                <a th:href="@{/candidate/dashboard}"
                   class="btn btn-outline-secondary">
                    Back to Dashboard
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
