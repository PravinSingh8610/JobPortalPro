
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Recruiter Registration | JobPortalPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #2563eb);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .register-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,.2);
        }

        .brand {
            color: #2563eb;
            font-weight: 800;
        }

        .form-control {
            padding: 11px;
            border-radius: 8px;
        }

        .btn-primary {
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="register-card">

                <h2 class="brand text-center">
                    JobPortalPro
                </h2>

                <p class="text-center text-muted">
                    Create Recruiter Account
                </p>

                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <form th:action="@{/recruiter/register}"
                      th:object="${recruiterRequest}"
                      method="post">

                    <!-- Full Name -->
                    <div class="mb-3">

                        <label class="form-label">Full Name</label>

                        <input type="text"
                               th:field="*{fullName}"
                               class="form-control"
                               placeholder="Enter your full name"
                               required>

                        <small class="text-danger"
                               th:errors="*{fullName}">
                        </small>

                    </div>

                    <!-- Email -->
                    <div class="mb-3">

                        <label class="form-label">Email Address</label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="Enter your email"
                               required>

                        <small class="text-danger"
                               th:errors="*{email}">
                        </small>

                    </div>

                    <!-- Password -->
                    <div class="mb-4">

                        <label class="form-label">Password</label>

                        <input type="password"
                               th:field="*{password}"
                               class="form-control"
                               placeholder="Minimum 8 characters"
                               minlength="8"
                               required>

                        <small class="text-danger"
                               th:errors="*{password}">
                        </small>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">

                        Create Recruiter Account

                    </button>

                </form>

                <p class="text-center mt-4">

                    Already registered?

                    <a th:href="@{/login}">Login</a>

                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>
