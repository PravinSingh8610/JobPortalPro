
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Declare Interview Result | JobPortalPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar-custom {
            background: #0f172a;
            padding: 20px;
        }

        .brand {
            color: #60a5fa;
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
        }

        .form-card {
            max-width: 650px;
            margin: 50px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<nav class="navbar-custom">
    <a th:href="@{/}" class="brand">JobPortalPro</a>
</nav>

<div class="container">

    <div class="form-card">

        <h3 class="fw-bold mb-2">Declare Interview Result</h3>

        <p class="text-muted mb-4">
            Evaluate the candidate and submit the final interview result.
        </p>

        <div class="alert alert-info">
            <strong>Candidate:</strong>
            <span th:text="${interview.application.candidate.fullName}">
                Candidate Name
            </span>

            <div class="mt-2">
                <strong>Job:</strong>
                <span th:text="${interview.application.job.title}">
                    Job Title
                </span>
            </div>
        </div>

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <form th:action="@{/recruiter/jobs/{jobId}/interviews/{interviewId}/result(
                  jobId=${jobId},
                  interviewId=${interview.id})}"
              method="post">

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="mb-4">
                <label for="result" class="form-label">
                    Interview Result
                </label>

                <select id="result"
                        name="result"
                        class="form-select"
                        required>

                    <option value="">Select Result</option>
                    <option value="SELECTED">SELECTED</option>
                    <option value="REJECTED">REJECTED</option>
                    <option value="ON_HOLD">ON HOLD</option>

                </select>
            </div>

            <div class="mb-4">
                <label for="feedback" class="form-label">
                    Recruiter Feedback
                </label>

                <textarea id="feedback"
                          name="feedback"
                          class="form-control"
                          rows="5"
                          maxlength="2000"
                          placeholder="Enter interview performance, technical skills and evaluation notes..."></textarea>

                <div class="form-text">
                    Maximum 2000 characters.
                </div>
            </div>

            <div class="d-flex gap-2 flex-wrap">

                <button type="submit"
                        class="btn btn-success"
                        onclick="return confirm('Submit this result? It cannot be changed using the current form.');">
                    Submit Result
                </button>

                <a th:href="@{/recruiter/jobs/{id}/interviews(id=${jobId})}"
                   class="btn btn-outline-secondary">
                    Back to Interviews
                </a>

            </div>

        </form>

    </div>
</div>

</body>
</html>
