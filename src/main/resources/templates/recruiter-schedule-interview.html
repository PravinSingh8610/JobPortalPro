
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Schedule Interview | JobPortalPro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #0f172a;
        }

        .page-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .candidate-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .form-control,
        .form-select {
            padding: 12px;
            border-radius: 9px;
        }

        .btn-schedule {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            font-weight: 600;
        }

        .btn-schedule:hover {
            background: #1d4ed8;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4 py-3">
    <a class="navbar-brand fw-bold"
       th:href="@{/recruiter/dashboard}">
        JobPortalPro
    </a>

    <a class="btn btn-outline-light"
       th:href="@{/recruiter/jobs}">
        Manage Jobs
    </a>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="page-card">

                <h2 class="fw-bold mb-2">
                    Schedule Interview
                </h2>

                <p class="text-muted mb-4">
                    Set interview details for your shortlisted candidate.
                </p>

                <!-- Candidate Information -->
                <div class="candidate-box">

                    <h5 class="fw-bold"
                        th:text="${jobApp.candidate.fullName}">
                        Candidate Name
                    </h5>

                    <p class="mb-1"
                       th:text="${jobApp.candidate.email}">
                        candidate@example.com
                    </p>

                    <span class="badge bg-success"
                          th:text="${jobApp.status}">
                        SHORTLISTED
                    </span>

                </div>

                <!-- Error Message -->
                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <!-- Interview Form -->
                <form
                    th:action="@{/recruiter/jobs/{jobId}/applications/{applicationId}/interview(jobId=${jobId},applicationId=${jobApp.id})}"
                    method="post">

                    <!-- Interview Date and Time -->
                    <div class="mb-3">
                        <label for="interviewDateTime"
                               class="form-label">
                            Interview Date &amp; Time
                        </label>

                        <input type="datetime-local"
                               name="interviewDateTime"
                               id="interviewDateTime"
                               class="form-control"
                               required>
                    </div>

                    <!-- Interview Mode -->
                    <div class="mb-3">
                        <label for="interviewMode"
                               class="form-label">
                            Interview Mode
                        </label>

                        <select name="interviewMode"
                                id="interviewMode"
                                class="form-select"
                                required
                                onchange="toggleInterviewFields()">

                            <option value="">
                                Select Interview Mode
                            </option>

                            <option value="ONLINE">
                                Online
                            </option>

                            <option value="OFFLINE">
                                Offline
                            </option>

                        </select>
                    </div>

                    <!-- Online Meeting Link -->
                    <div class="mb-3"
                         id="meetingLinkBox"
                         style="display:none;">

                        <label for="meetingLink"
                               class="form-label">
                            Meeting Link
                        </label>

                        <input type="url"
                               name="meetingLink"
                               id="meetingLink"
                               class="form-control"
                               placeholder="https://meet.google.com/...">
                    </div>

                    <!-- Offline Interview Location -->
                    <div class="mb-3"
                         id="locationBox"
                         style="display:none;">

                        <label for="interviewLocation"
                               class="form-label">
                            Interview Location
                        </label>

                        <input type="text"
                               name="interviewLocation"
                               id="interviewLocation"
                               class="form-control"
                               placeholder="Office address or interview venue">
                    </div>

                    <!-- Interview Notes -->
                    <div class="mb-4">
                        <label for="notes"
                               class="form-label">
                            Interview Notes (Optional)
                        </label>

                        <textarea name="notes"
                                  id="notes"
                                  class="form-control"
                                  rows="4"
                                  maxlength="1000"
                                  placeholder="Instructions for the candidate"></textarea>
                    </div>

                    <div class="d-flex gap-3 flex-wrap">

                        <button type="submit"
                                class="btn btn-schedule">
                            Schedule Interview
                        </button>

                        <a th:href="@{/recruiter/jobs/{jobId}/applications(jobId=${jobId})}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

<script>
    function toggleInterviewFields() {

        const mode =
            document.getElementById("interviewMode").value;

        const meetingBox =
            document.getElementById("meetingLinkBox");

        const locationBox =
            document.getElementById("locationBox");

        const meetingInput =
            document.getElementById("meetingLink");

        const locationInput =
            document.getElementById("interviewLocation");

        meetingBox.style.display =
            mode === "ONLINE" ? "block" : "none";

        locationBox.style.display =
            mode === "OFFLINE" ? "block" : "none";

        meetingInput.required = mode === "ONLINE";
        locationInput.required = mode === "OFFLINE";

        if (mode !== "ONLINE") {
            meetingInput.value = "";
        }

        if (mode !== "OFFLINE") {
            locationInput.value = "";
        }
    }

    const dateInput =
        document.getElementById("interviewDateTime");

    function updateMinimumDateTime() {

        const now = new Date();

        const localDate = new Date(
            now.getTime() -
            now.getTimezoneOffset() * 60000
        );

        dateInput.min =
            localDate.toISOString().slice(0, 16);
    }

    updateMinimumDateTime();

    dateInput.addEventListener(
        "focus",
        updateMinimumDateTime
    );
</script>

</body>
</html>
