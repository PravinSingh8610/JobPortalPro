
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | JobPortalPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center p-5 bg-white rounded-4 shadow">

        <h1 class="display-1 fw-bold text-primary">404</h1>

        <h2 class="fw-bold">Page Not Found!</h2>

        <p class="text-secondary mt-3">
            Sorry! The page you are looking for does not exist.
        </p>

        <p class="text-danger" th:if="${errorMessage}"
           th:text="${errorMessage}"></p>

        <a th:href="@{/}" class="btn btn-primary mt-3">
            Back to Home
        </a>

    </div>
</div>

</body>
</html>
