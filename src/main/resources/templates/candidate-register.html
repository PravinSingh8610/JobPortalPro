
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Register | JobPortalPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #2563eb);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .register-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .brand {
            color: #2563eb;
            font-weight: 800;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="register-card">

                <h2 class="brand text-center">
                    JobPortalPro
                </h2>

                <p class="text-center text-muted">
                    Create Your Account
                </p>

                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <form th:action="@{/candidate/register}"
                      th:object="${registerRequest}"
                      method="post">

                    <div class="mb-3">
                        <label>Full Name</label>
                        <input type="text"
                               th:field="*{fullName}"
                               class="form-control"
                               required>

                        <small class="text-danger"
                               th:errors="*{fullName}"></small>
                    </div>

                    <div class="mb-3">
                        <label>Email Address</label>
                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               required>

                        <small class="text-danger"
                               th:errors="*{email}"></small>
                    </div>

                    <div class="mb-4">
                        <label>Password</label>
                        <input type="password"
                               th:field="*{password}"
                               class="form-control"
                               minlength="8"
                               required>

                        <small class="text-danger"
                               th:errors="*{password}"></small>
                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">
                        Create Account
                    </button>

                </form>

                <p class="text-center mt-4">
                    Already have an account?
                    <a th:href="@{/login}">Login</a>
                </p>

            </div>
        </div>
    </div>
</div>

</body>
</html>
