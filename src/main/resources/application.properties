
spring.application.name=JobPortalPro

server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/jobportal_db
spring.datasource.username=root
spring.datasource.password=YOUR_EXISTING_PASSWORD

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Candidate Onboarding Document Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Private Document Storage Directory
app.onboarding.upload-dir=${user.home}/jobportalpro-private/onboarding
