
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Post New Job | JobPortalPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #0f172a;
        }

        .form-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 8px 25px rgba(0,0,0,.06);
        }

        .form-label {
            font-weight: 600;
        }

        .page-title {
            font-weight: 800;
            color: #0f172a;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4 py-3">
    <a class="navbar-brand fw-bold"
       th:href="@{/recruiter/dashboard}">
        JobPortalPro
    </a>

    <a class="btn btn-outline-light"
       th:href="@{/recruiter/dashboard}">
        Dashboard
    </a>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <h2 class="page-title">Post New Job</h2>

            <p class="text-muted mb-4">
                Create a professional job listing for your company.
            </p>

            <div class="form-card">

                <div th:if="${error}"
                     class="alert alert-warning"
                     th:text="${error}">
                </div>

                <form th:action="@{/recruiter/jobs/new}"
                      th:object="${jobRequest}"
                      method="post">

                    <div class="mb-3">
                        <label class="form-label">Job Title</label>

                        <input type="text"
                               th:field="*{title}"
                               class="form-control"
                               placeholder="Java Backend Developer">

                        <div class="text-danger"
                             th:errors="*{title}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Job Description</label>

                        <textarea th:field="*{description}"
                                  class="form-control"
                                  rows="5"
                                  placeholder="Describe responsibilities and requirements"></textarea>

                        <div class="text-danger"
                             th:errors="*{description}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Required Skills</label>

                        <input type="text"
                               th:field="*{skills}"
                               class="form-control"
                               placeholder="Java, Spring Boot, MySQL">

                        <div class="text-danger"
                             th:errors="*{skills}"></div>
                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Location</label>

                            <input type="text"
                                   th:field="*{location}"
                                   class="form-control"
                                   placeholder="Bangalore">

                            <div class="text-danger"
                                 th:errors="*{location}"></div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Employment Type</label>

                            <select th:field="*{employmentType}"
                                    class="form-select">

                                <option value="">Select Type</option>
                                <option value="FULL_TIME">Full Time</option>
                                <option value="PART_TIME">Part Time</option>
                                <option value="INTERNSHIP">Internship</option>
                                <option value="CONTRACT">Contract</option>
                            </select>

                            <div class="text-danger"
                                 th:errors="*{employmentType}"></div>
                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Minimum Salary</label>

                            <input type="number"
                                   step="0.01"
                                   min="0"
                                   th:field="*{minSalary}"
                                   class="form-control">

                            <div class="text-danger"
                                 th:errors="*{minSalary}"></div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Maximum Salary</label>

                            <input type="number"
                                   step="0.01"
                                   min="0"
                                   th:field="*{maxSalary}"
                                   class="form-control">

                            <div class="text-danger"
                                 th:errors="*{maxSalary}"></div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Experience (Years)</label>

                            <input type="number"
                                   min="0"
                                   th:field="*{experienceYears}"
                                   class="form-control">

                            <div class="text-danger"
                                 th:errors="*{experienceYears}"></div>
                        </div>

                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Application Deadline
                        </label>

                        <input type="date"
                               th:field="*{applicationDeadline}"
                               class="form-control">

                        <div class="text-danger"
                             th:errors="*{applicationDeadline}"></div>
                    </div>

                    <div class="d-flex gap-3">

                        <button type="submit"
                                class="btn btn-primary px-4">
                            Validate Job Details
                        </button>

                        <a th:href="@{/recruiter/dashboard}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

</body>
</html>
