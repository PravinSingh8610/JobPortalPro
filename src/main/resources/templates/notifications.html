
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | JobPortalPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #172554;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
            font-size: 23px;
        }

        .page-heading {
            font-weight: 700;
            color: #172554;
        }

        .notification-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.04);
        }

        .unread {
            border-left: 5px solid #2563eb;
            background: #eff6ff;
        }

        .notification-title {
            font-weight: 700;
            color: #1e293b;
        }

        .notification-message {
            color: #475569;
        }

        .empty-state {
            background: white;
            padding: 60px 20px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            JobPortalPro
        </a>

        <div class="ms-auto">
            <a th:href="@{/candidate/dashboard}"
               class="btn btn-outline-light btn-sm">
                Dashboard
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex flex-wrap justify-content-between
                align-items-center mb-4">

        <div>
            <h2 class="page-heading">My Notifications</h2>

            <p class="text-muted mb-0">
                Stay updated with your latest activities.
            </p>
        </div>

        <div class="mt-3 mt-md-0">
            <span class="badge bg-primary fs-6">
                Unread:
                <span th:text="${unreadCount}">0</span>
            </span>

            <form th:if="${unreadCount > 0}"
                  th:action="@{/notifications/read-all}"
                  method="post"
                  class="d-inline">

                <button type="submit"
                        class="btn btn-success btn-sm ms-2">
                    Mark All as Read
                </button>
            </form>
        </div>

    </div>

    <!-- Notifications List -->

    <div th:if="${!#lists.isEmpty(notifications)}">

        <div th:each="notification : ${notifications}"
             class="notification-card"
             th:classappend="${!notification.read} ? ' unread' : ''">

            <div class="d-flex justify-content-between
                        align-items-start flex-wrap">

                <div class="mb-3">

                    <h5 class="notification-title"
                        th:text="${notification.title}">
                        Notification Title
                    </h5>

                    <p class="notification-message mb-2"
                       th:text="${notification.message}">
                        Notification message
                    </p>

                    <div class="text-muted small">

                        <span th:text="${notification.type}">
                            TYPE
                        </span>

                        <span> | </span>

                        <span th:text="${#temporals.format(
                            notification.createdAt,
                            'dd MMM yyyy, hh:mm a')}">
                            Date
                        </span>

                    </div>

                </div>

                <div>
                    <span th:if="${!notification.read}"
                          class="badge bg-primary">
                        Unread
                    </span>

                    <span th:if="${notification.read}"
                          class="badge bg-secondary">
                        Read
                    </span>
                </div>

            </div>

            <div class="d-flex flex-wrap gap-2 mt-2">

                <form th:if="${!notification.read}"
                      th:action="@{/notifications/{id}/read(id=${notification.id})}"
                      method="post">

                    <button type="submit"
                            class="btn btn-outline-primary btn-sm">
                        Mark as Read
                    </button>
                </form>

                <a th:if="${notification.link != null
                            and !#strings.isEmpty(notification.link)}"
                   th:href="${notification.link}"
                   class="btn btn-primary btn-sm">
                    View Details
                </a>

            </div>

        </div>

    </div>

    <!-- Empty State -->

    <div th:if="${#lists.isEmpty(notifications)}"
         class="empty-state">

        <h4 class="text-secondary">
            No Notifications Yet!
        </h4>

        <p class="text-muted mb-0">
            Your notifications will appear here when there is an update.
        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
