
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Edit Job | JobPortalPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #0f172a;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,.06);
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4 py-3">
    <a class="navbar-brand fw-bold"
       th:href="@{/recruiter/dashboard}">
        JobPortalPro
    </a>

    <a class="btn btn-outline-light"
       th:href="@{/recruiter/jobs}">
        Back to Manage Jobs
    </a>
</nav>

<div class="container py-5">

    <div class="form-card mx-auto" style="max-width: 850px;">

        <h2 class="fw-bold mb-2">Edit Job</h2>

        <p class="text-muted mb-4">
            Update your existing job details.
        </p>

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <form th:action="@{/recruiter/jobs/{id}/edit(id=${jobId})}"
              th:object="${jobRequest}"
              method="post">

            <!-- Job Title -->
            <div class="mb-3">
                <label class="form-label">Job Title</label>

                <input type="text"
                       class="form-control"
                       th:field="*{title}"
                       required>

                <div class="text-danger small"
                     th:errors="*{title}"></div>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label">Job Description</label>

                <textarea class="form-control"
                          th:field="*{description}"
                          rows="5"
                          required></textarea>

                <div class="text-danger small"
                     th:errors="*{description}"></div>
            </div>

            <!-- Skills -->
            <div class="mb-3">
                <label class="form-label">Required Skills</label>

                <input type="text"
                       class="form-control"
                       th:field="*{skills}"
                       required>

                <div class="text-danger small"
                     th:errors="*{skills}"></div>
            </div>

            <!-- Location -->
            <div class="mb-3">
                <label class="form-label">Job Location</label>

                <input type="text"
                       class="form-control"
                       th:field="*{location}"
                       required>

                <div class="text-danger small"
                     th:errors="*{location}"></div>
            </div>

            <!-- Salary -->
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Minimum Salary</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{minSalary}"
                           min="0"
                           step="0.01"
                           required>

                    <div class="text-danger small"
                         th:errors="*{minSalary}"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Maximum Salary</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{maxSalary}"
                           min="0"
                           step="0.01"
                           required>

                    <div class="text-danger small"
                         th:errors="*{maxSalary}"></div>
                </div>

            </div>

            <!-- Experience -->
            <div class="mb-3">
                <label class="form-label">
                    Experience (Years)
                </label>

                <input type="number"
                       class="form-control"
                       th:field="*{experienceYears}"
                       min="0"
                       required>

                <div class="text-danger small"
                     th:errors="*{experienceYears}"></div>
            </div>

            <!-- Employment Type -->
            <div class="mb-3">
                <label class="form-label">Employment Type</label>

                <select class="form-select"
                        th:field="*{employmentType}"
                        required>

                    <option value="">Select Employment Type</option>
                    <option value="FULL_TIME">Full Time</option>
                    <option value="PART_TIME">Part Time</option>
                    <option value="INTERNSHIP">Internship</option>
                    <option value="CONTRACT">Contract</option>

                </select>

                <div class="text-danger small"
                     th:errors="*{employmentType}"></div>
            </div>

            <!-- Application Deadline -->
            <div class="mb-4">
                <label class="form-label">
                    Application Deadline
                </label>

                <input type="date"
                       class="form-control"
                       th:field="*{applicationDeadline}"
                       required>

                <div class="text-danger small"
                     th:errors="*{applicationDeadline}"></div>
            </div>

            <!-- Buttons -->
            <div class="d-flex gap-3">

                <button type="submit"
                        class="btn btn-primary px-4">
                    Update Job
                </button>

                <a th:href="@{/recruiter/jobs}"
                   class="btn btn-outline-secondary px-4">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
