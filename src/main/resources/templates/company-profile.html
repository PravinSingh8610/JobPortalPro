
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Company Profile | JobPortalPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: 'Segoe UI', sans-serif;
        }

        .profile-card {
            max-width: 800px;
            margin: auto;
            border: none;
            border-radius: 16px;
            overflow: hidden;
        }

        .profile-header {
            background: linear-gradient(135deg, #0f172a, #2563eb);
            color: white;
            padding: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .form-control {
            padding: 11px;
            border-radius: 8px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="card profile-card shadow">

        <!-- Header -->
        <div class="profile-header">

            <h2 class="fw-bold mb-2">Company Profile</h2>

            <p class="mb-0">
                Complete your company information to start posting jobs.
            </p>

        </div>

        <div class="card-body p-4">

            <!-- Success Message -->
            <div th:if="${param.success}"
                 class="alert alert-success">

                Company profile saved successfully!

            </div>

            <!-- Error Message -->
            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <!-- Verification Status -->
            <div class="alert alert-info">

                <strong>Verification Status:</strong>

                <span class="badge bg-warning text-dark"
                      th:text="${company.verificationStatus != null ? company.verificationStatus : 'PENDING'}">
                    PENDING
                </span>

                <p class="mb-0 mt-2 small">
                    Your company profile will be reviewed by the administrator.
                </p>

            </div>

            <!-- Company Profile Form -->
            <form th:action="@{/recruiter/company-profile}"
                  th:object="${company}"
                  method="post">

                <!-- Company Name -->
                <div class="mb-3">

                    <label class="form-label">Company Name *</label>

                    <input type="text"
                           th:field="*{companyName}"
                           class="form-control"
                           placeholder="Enter company name"
                           maxlength="150"
                           required>

                </div>

                <!-- Industry -->
                <div class="mb-3">

                    <label class="form-label">Industry</label>

                    <input type="text"
                           th:field="*{industry}"
                           class="form-control"
                           placeholder="Example: Information Technology"
                           maxlength="150">

                </div>

                <!-- Location -->
                <div class="mb-3">

                    <label class="form-label">Company Location</label>

                    <input type="text"
                           th:field="*{location}"
                           class="form-control"
                           placeholder="Enter city and state"
                           maxlength="150">

                </div>

                <!-- Website -->
                <div class="mb-3">

                    <label class="form-label">Company Website</label>

                    <input type="url"
                           th:field="*{website}"
                           class="form-control"
                           placeholder="https://example.com"
                           maxlength="255">

                </div>

                <!-- Logo URL -->
                <div class="mb-3">

                    <label class="form-label">Company Logo URL</label>

                    <input type="url"
                           th:field="*{logoUrl}"
                           class="form-control"
                           placeholder="https://example.com/logo.png"
                           maxlength="500">

                </div>

                <!-- Description -->
                <div class="mb-4">

                    <label class="form-label">Company Description</label>

                    <textarea th:field="*{description}"
                              class="form-control"
                              rows="5"
                              placeholder="Tell us about your company..."
                              maxlength="2000">
                    </textarea>

                </div>

                <!-- Buttons -->
                <div class="d-flex flex-wrap gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        Save Company Profile

                    </button>

                    <a th:href="@{/recruiter/dashboard}"
                       class="btn btn-outline-secondary">

                        Back to Dashboard

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
