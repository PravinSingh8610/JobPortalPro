
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reschedule Interview | JobPortalPro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f3f6fb;
            font-family: Arial, sans-serif;
        }

        .form-card {
            max-width: 780px;
            margin: 50px auto;
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .card-header-custom {
            background: #142c56;
            color: white;
            padding: 25px;
            border-radius: 16px 16px 0 0;
        }

        .btn-primary {
            background: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card form-card">

        <div class="card-header-custom">
            <h3 class="mb-2">Reschedule Interview</h3>
            <p class="mb-0">
                Update interview schedule and meeting details
            </p>
        </div>

        <div class="card-body p-4">

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <div class="alert alert-info">
                <strong>Candidate:</strong>
                <span th:text="${interview.application.candidate.fullName}">
                </span>

                <br>

                <strong>Job:</strong>
                <span th:text="${interview.application.job.title}">
                </span>
            </div>

            <form method="post"
                  th:action="@{/recruiter/jobs/{jobId}/interviews/{interviewId}/reschedule(
                      jobId=${jobId},
                      interviewId=${interview.id}
                  )}">

                <input type="hidden"
                       th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Interview Date & Time
                    </label>

                    <input type="datetime-local"
                           name="interviewDateTime"
                           class="form-control"
                           th:value="${#temporals.format(
                               interview.interviewDateTime,
                               'yyyy-MM-dd''T''HH:mm'
                           )}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Interview Mode
                    </label>

                    <select name="interviewMode"
                            id="interviewMode"
                            class="form-select"
                            onchange="toggleFields()"
                            required>

                        <option value="ONLINE"
                                th:selected="${interview.interviewMode == 'ONLINE'}">
                            Online
                        </option>

                        <option value="OFFLINE"
                                th:selected="${interview.interviewMode == 'OFFLINE'}">
                            Offline
                        </option>
                    </select>
                </div>

                <div class="mb-3" id="onlineFields">
                    <label class="form-label fw-semibold">
                        Meeting Link
                    </label>

                    <input type="url"
                           name="meetingLink"
                           id="meetingLink"
                           class="form-control"
                           placeholder="https://meet.google.com/..."
                           th:value="${interview.meetingLink}">
                </div>

                <div class="mb-3" id="offlineFields">
                    <label class="form-label fw-semibold">
                        Interview Location
                    </label>

                    <input type="text"
                           name="interviewLocation"
                           id="interviewLocation"
                           class="form-control"
                           placeholder="Enter interview location"
                           th:value="${interview.interviewLocation}">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">
                        Interview Instructions
                    </label>

                    <textarea name="notes"
                              class="form-control"
                              rows="4"
                              maxlength="1000"
                              th:text="${interview.notes}">
                    </textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary">
                        Save Changes
                    </button>

                    <a class="btn btn-outline-secondary"
                       th:href="@{/recruiter/jobs/{id}/interviews(id=${jobId})}">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    function toggleFields() {
        const mode = document.getElementById("interviewMode").value;

        const online = document.getElementById("onlineFields");
        const offline = document.getElementById("offlineFields");

        const meetingLink = document.getElementById("meetingLink");
        const interviewLocation = document.getElementById("interviewLocation");

        online.style.display = mode === "ONLINE" ? "block" : "none";
        offline.style.display = mode === "OFFLINE" ? "block" : "none";

        meetingLink.required = mode === "ONLINE";
        interviewLocation.required = mode === "OFFLINE";

        meetingLink.disabled = mode !== "ONLINE";
        interviewLocation.disabled = mode !== "OFFLINE";
    }

    document.addEventListener("DOMContentLoaded", toggleFields);
</script>

</body>
</html>
